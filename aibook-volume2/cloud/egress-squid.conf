# Listing 34.1 — Egress proxy allow-list (Squid, abridged)
# From "The Birth and Adolescence of Artificial Intelligence", Volume 2, Section 34.4. Illustrative, abridged: checked against the documentation of the versions in Appendix B (Volume 2), not run end to end as one system. Test in staging before use.
# SPDX-License-Identifier: MIT
# only the gateway segment may leave
acl gateway src 10.20.0.0/24
acl llm_api dstdomain api.anthropic.com
acl llm_api dstdomain api.openai.com
acl llm_api dstdomain generativelanguage.googleapis.com
acl llm_api dstdomain api.x.ai
# add a provider's regional host if one is bought
acl SSL_ports port 443
http_access allow CONNECT gateway llm_api SSL_ports
http_access deny all
# platforms are reached by private
# endpoints, not through this proxy
