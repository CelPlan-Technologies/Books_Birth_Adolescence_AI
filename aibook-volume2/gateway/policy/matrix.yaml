# Listing 30.1 — Routing matrix as policy data
# SPDX-License-Identifier: MIT
# From "The Birth and Adolescence of Artificial Intelligence", Volume 2, Section 30.3. Illustrative: checked against the documentation of the versions in Appendix B (Volume 2), not run end to end as one system. Test in staging before use.
classes: [R1, R2, R3, R4, R5]
destinations:
  box:   {R1: allow, R2: allow,
          R3: own_or_readable, R4: deny,
          R5: allow}
  rack:  {R1: allow, R2: allow,
          R3: allow, R4: named_users,
          R5: deny_unless_shared}
  cloud: {R1: allow, R2: allow,
          R3: transform_drafting,
          R4: deny, R5: deny_unless_sent}
  web:   {R1: allow, R2: generic_query,
          R3: generic_query, R4: deny,
          R5: generic_query_on_box}
# per destination, every class present must
# permit the call, with all its conditions
combine: all_present_classes
on_uncertain_label: add_all_candidates
audit: every_decision
